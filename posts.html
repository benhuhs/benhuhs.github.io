---
layout: default
title: 모든 기록
permalink: /posts/
---
<section class="page-head">
  <h1 class="page-title">모든 기록</h1>
  <p class="page-sub">보안과 개발을 공부하며 남긴 기록 전체</p>
</section>

<section class="section">
  <div class="cat-search" id="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="search" placeholder="제목이나 카테고리로 검색" aria-label="모든 기록에서 제목이나 카테고리로 검색" autocomplete="off" data-cat-filter>
  </div>
  {% if site.posts.size > 0 %}
  <p class="section-meta" data-cat-count data-total="{{ site.posts | size }}">글 {{ site.posts | size }}개</p>
  <ul class="post-list" data-cat-list>
    {% for post in site.posts %}
      {% include post-item.html post=post show_cat=true %}
    {% endfor %}
  </ul>
  <p class="empty" data-cat-empty hidden>검색 결과 없음</p>
  {% else %}
  <p class="empty">첫 기록 준비 중</p>
  {% endif %}
</section>
