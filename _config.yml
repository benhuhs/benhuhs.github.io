title: benhuhs.log
description: 광운대 컴퓨터정보공학부 허지완의 개발·보안 학습 기록
url: "https://benhuhs.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

author:
  name: 허지완
  handle: benhuhs
  github: benhuhs

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:categories/:year/:month/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
