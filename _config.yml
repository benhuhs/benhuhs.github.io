remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"

title: "Benhuhs's Blog"
description: "개발 · CTF · Bug Bounty 기록"
url: "https://benhuhs.github.io"
locale: "ko-KR"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap

include:
  - _pages

author:
  name: "Benhuhs"
  avatar: "/assets/images/Blackcat jpg.jpg"
  bio: "광운대 컴퓨터정보공학부 | Blackcat | HSPACE Knights Frontier 3기"
  location: "Seoul, Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/benhuhs"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true