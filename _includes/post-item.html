{% assign c = site.data.categories | where: "slug", include.post.categories.first | first %}
<li class="post-item">
  <a class="post-link" href="{{ include.post.url | relative_url }}">
    <time class="post-date mono" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%Y.%m.%d" }}</time>
    <span class="post-title">{{ include.post.title }}</span>
    {% if include.show_cat and c %}<span class="post-cat">{{ c.name }}</span>{% endif %}
  </a>
</li>
